[package]
name = "sheaf-core"
description = "Storage, model, index and search language of the Sheaf notes app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true

[lib]
# The benchmarks are criterion's, in benches/; libtest would reject its arguments.
bench = false

[features]
# Generator for synthetic note folders, used by benchmarks and budget checks.
testgen = []

[dependencies]
gettext-rs.workspace = true
jiff.workspace = true
log.workspace = true
notify.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
tantivy.workspace = true
toml.workspace = true
ulid.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[bench]]
name = "search"
harness = false
required-features = ["testgen"]

[[example]]
name = "search_budget"
required-features = ["testgen"]
