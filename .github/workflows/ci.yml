name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # The editor is a private repository behind a deploy key; cargo's own git
  # library cannot use the ssh agent, the git command line can.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Give cargo access to the editor repository
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EDITOR_DEPLOY_KEY }}
      - run: git config --global url."ssh://git@github.com/taulit/gpui-markdown-editor".insteadOf "https://github.com/taulit/gpui-markdown-editor"
      - name: Install system packages
        # dbus-daemon and gettext for the tests, the rest to build GPUI.
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          dbus-daemon gettext pkg-config
          libfontconfig-dev libfreetype-dev libwayland-dev
          libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked

  deny:
    name: licenses and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Give cargo access to the editor repository
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EDITOR_DEPLOY_KEY }}
      - run: git config --global url."ssh://git@github.com/taulit/gpui-markdown-editor".insteadOf "https://github.com/taulit/gpui-markdown-editor"
      # On the runner rather than in the action's container, which has no ssh agent.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  search-budget:
    name: search budget (10,000 notes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Give cargo access to the editor repository
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EDITOR_DEPLOY_KEY }}
      - run: git config --global url."ssh://git@github.com/taulit/gpui-markdown-editor".insteadOf "https://github.com/taulit/gpui-markdown-editor"
      - run: cargo run --release --locked -p sheaf-core --features testgen --example search_budget
