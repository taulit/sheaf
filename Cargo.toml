[workspace]
resolver = "3"
members = ["crates/sheaf-core", "crates/sheaf-searchd", "crates/sheaf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
repository = "https://github.com/taulit/sheaf"
homepage = "https://github.com/taulit/sheaf"
publish = false

[workspace.dependencies]
sheaf-core = { path = "crates/sheaf-core" }
sheaf-searchd = { path = "crates/sheaf-searchd" }

clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
jiff = { version = "1", features = ["serde"] }
log = "0.4"
notify = "8.2"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = { version = "0.27", default-features = false, features = ["mmap"] }
thiserror = "2"
toml = "1"
ulid = "3"
unicode-normalization = "0.1"
zbus = "6.3"

assert_cmd = "2.2"
criterion = "0.8"
insta = { version = "1.49", features = ["json"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.bench]
debug = false

# Snapshot tests diff large strings; optimising these two keeps `cargo test` fast.
[profile.dev.package.insta]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3
